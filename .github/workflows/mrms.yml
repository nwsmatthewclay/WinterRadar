name: MRMS Winter Radar

on:
  workflow_dispatch:
  schedule:
    - cron: "2,7,12,17,22,27,32,37,42,47,52,57 * * * *"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: mrms-radar
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libeccodes-dev \
            libeccodes-tools \
            libgeos-dev \
            libproj-dev \
            proj-data \
            proj-bin

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install \
            numpy \
            requests \
            Pillow \
            xarray \
            cfgrib \
            matplotlib \
            gspread \
            google-auth \
            google-api-python-client \
            pygrib \
            cartopy \
            metpy

      # ----------------------------------------------------------
      # Main MRMS processing
      # ----------------------------------------------------------
      - name: Run main MRMS processing
        working-directory: src
        env:
          MPLBACKEND: Agg
          OMP_NUM_THREADS: "1"
          OPENBLAS_NUM_THREADS: "1"
          MKL_NUM_THREADS: "1"
          NUMEXPR_NUM_THREADS: "1"
        run: |
          set -e
          mkdir -p ../outputs

          echo "=============================================="
          echo "RUNNING MAIN MRMS PROCESSING"
          echo "=============================================="

          python -u main.py 2>&1 | tee ../outputs/main.log

          echo
          echo "MAIN OUTPUT CHECK"
          test -s ../outputs/mrms_current.png
          test -s ../outputs/mrms_current.json
          test -s ../outputs/winter_phase_mask.png

          ls -lh \
            ../outputs/mrms_current.png \
            ../outputs/mrms_current.json \
            ../outputs/winter_phase_mask.png

      # ----------------------------------------------------------
      # MRMS diagnostics
      # ----------------------------------------------------------
      - name: Build MRMS diagnostics
        working-directory: src
        env:
          MPLBACKEND: Agg
          OMP_NUM_THREADS: "1"
          OPENBLAS_NUM_THREADS: "1"
          MKL_NUM_THREADS: "1"
          NUMEXPR_NUM_THREADS: "1"
        run: |
          set -e
          python -u build_mrms_diagnostics.py

      # ----------------------------------------------------------
      # Vertical dual-pol
      # ----------------------------------------------------------
      - name: Download vertical dual-pol data
        working-directory: src
        env:
          OMP_NUM_THREADS: "1"
          OPENBLAS_NUM_THREADS: "1"
          MKL_NUM_THREADS: "1"
          NUMEXPR_NUM_THREADS: "1"
        run: |
          set -e
          python -u download_vertical_dualpol.py

      - name: Build vertical dual-pol diagnostic
        working-directory: src
        env:
          MPLBACKEND: Agg
          OMP_NUM_THREADS: "1"
          OPENBLAS_NUM_THREADS: "1"
          MKL_NUM_THREADS: "1"
          NUMEXPR_NUM_THREADS: "1"
        run: |
          set -e
          python -u build_vertical_dualpol_diagnostic.py

      - name: Normalize vertical diagnostic filename
        run: |
          set -e
          if [ -f outputs/vertical_dualpol_diagnostic.png ]; then
            cp outputs/vertical_dualpol_diagnostic.png outputs/mrms_vertical_dualpol.png
          elif [ ! -f outputs/mrms_vertical_dualpol.png ]; then
            echo "ERROR: vertical dual-pol diagnostic was not created."
            exit 1
          fi

      # ----------------------------------------------------------
      # Winter diagnostic
      # ----------------------------------------------------------
      - name: Build winter precipitation diagnostic
        working-directory: src
        env:
          MPLBACKEND: Agg
          OMP_NUM_THREADS: "1"
          OPENBLAS_NUM_THREADS: "1"
          MKL_NUM_THREADS: "1"
          NUMEXPR_NUM_THREADS: "1"
        run: |
          set -e
          python -u build_winter_mask.py

      # ----------------------------------------------------------
      # Verify generated outputs
      # ----------------------------------------------------------
      - name: Verify generated outputs
        run: |
          set -e

          echo "=============================="
          echo "GENERATED OUTPUT CHECK"
          echo "=============================="

          files=(
            "outputs/mrms_current.png"
            "outputs/mrms_current.json"
            "outputs/winter_phase_mask.png"
            "outputs/mrms_diagnostics.png"
            "outputs/mrms_diagnostics.json"
            "outputs/mrms_vertical_dualpol.png"
            "outputs/winter_mask_diagnostics.png"
            "outputs/winter_mask_diagnostics.json"
          )

          for file in "${files[@]}"; do
            if [ -s "$file" ]; then
              echo "OK: $file"
              ls -lh "$file"
            else
              echo "ERROR: MISSING OR EMPTY $file"
              exit 1
            fi
          done

      # ----------------------------------------------------------
      # Build GitHub Pages artifact
      # ----------------------------------------------------------
      - name: Assemble Pages site
        run: |
          set -e

          rm -rf site
          mkdir -p site/outputs

          cp index.html site/index.html
          cp outputs/mrms_current.png site/outputs/mrms_current.png
          cp outputs/mrms_current.json site/outputs/mrms_current.json
          cp outputs/winter_phase_mask.png site/outputs/winter_phase_mask.png
          cp outputs/mrms_diagnostics.png site/outputs/mrms_diagnostics.png
          cp outputs/mrms_diagnostics.json site/outputs/mrms_diagnostics.json
          cp outputs/mrms_vertical_dualpol.png site/outputs/mrms_vertical_dualpol.png
          cp outputs/winter_mask_diagnostics.png site/outputs/winter_mask_diagnostics.png
          cp outputs/winter_mask_diagnostics.json site/outputs/winter_mask_diagnostics.json

          echo "PAGES ARTIFACT CONTENT"
          find site -maxdepth 2 -type f -printf "%p (%s bytes)\n" | sort

          test -s site/index.html
          test -s site/outputs/mrms_current.png
          test -s site/outputs/mrms_current.json
          test -s site/outputs/winter_phase_mask.png
          test -s site/outputs/mrms_diagnostics.png
          test -s site/outputs/mrms_diagnostics.json
          test -s site/outputs/mrms_vertical_dualpol.png
          test -s site/outputs/winter_mask_diagnostics.png
          test -s site/outputs/winter_mask_diagnostics.json

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./site

  deploy:
    needs: build
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    permissions:
      pages: write
      id-token: write

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
