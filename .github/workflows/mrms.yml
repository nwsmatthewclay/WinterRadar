name: MRMS Winter Radar

on:
  workflow_dispatch:
  schedule:
    - cron: "2,7,12,17,22,27,32,37,42,47,52,57 * * * *"

permissions:
  contents: read
  pages: write
  id-token: write

# Do NOT cancel a running map build when the next 5-minute trigger fires.
# GitHub will keep one run active and retain the newest pending run.
concurrency:
  group: mrms-map
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libeccodes-dev \
            libeccodes-tools

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install \
            numpy \
            requests \
            Pillow \
            xarray \
            cfgrib

      # ----------------------------------------------------------
      # THIS IS THE ONLY REQUIRED PROCESS FOR THE LIVE MAP.
      # Diagnostics are intentionally not allowed to block Pages.
      # ----------------------------------------------------------
      - name: Run main MRMS map processing
        working-directory: src
        env:
          MPLBACKEND: Agg
          OMP_NUM_THREADS: "1"
          OPENBLAS_NUM_THREADS: "1"
          MKL_NUM_THREADS: "1"
          NUMEXPR_NUM_THREADS: "1"
        run: |
          set -e

          mkdir -p ../outputs

          echo "=============================================="
          echo "RUNNING LIVE MRMS MAP"
          echo "=============================================="

          python -u main.py 2>&1 | tee ../outputs/main.log

          echo
          echo "=============================================="
          echo "LIVE MRMS OUTPUT CHECK"
          echo "=============================================="

          test -s ../outputs/mrms_current.png
          test -s ../outputs/mrms_current.json
          test -s ../outputs/winter_phase_mask.png

          file ../outputs/mrms_current.png
          file ../outputs/winter_phase_mask.png
          ls -lh \
            ../outputs/mrms_current.png \
            ../outputs/mrms_current.json \
            ../outputs/winter_phase_mask.png

          echo "LIVE MRMS MAP OUTPUTS READY"

      # ----------------------------------------------------------
      # Build and deploy Pages immediately after main.py succeeds.
      # Nothing else can block the live radar map.
      # ----------------------------------------------------------
      - name: Assemble Pages site
        run: |
          set -e

          rm -rf site
          mkdir -p site/outputs

          cp index.html site/index.html
          cp outputs/mrms_current.png site/outputs/mrms_current.png
          cp outputs/mrms_current.json site/outputs/mrms_current.json
          cp outputs/winter_phase_mask.png site/outputs/winter_phase_mask.png

          echo "=============================================="
          echo "PAGES CONTENT"
          echo "=============================================="
          find site -maxdepth 2 -type f -printf "%p (%s bytes)\n" | sort

          test -s site/index.html
          test -s site/outputs/mrms_current.png
          test -s site/outputs/mrms_current.json
          test -s site/outputs/winter_phase_mask.png

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
