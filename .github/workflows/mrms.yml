name: MRMS Winter Radar

on:
  workflow_dispatch:
  schedule:
    - cron: "2,7,12,17,22,27,32,37,42,47,52,57 * * * *"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: mrms-radar
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libeccodes-dev \
            libeccodes-tools

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install \
            numpy \
            requests \
            Pillow \
            xarray \
            cfgrib \
            matplotlib \
            pygrib \
            scipy \
            metpy \
            pyproj

      - name: Core syntax QC
        run: |
          python -m py_compile \
            src/config.py \
            src/download_mrms.py \
            src/read_mrms.py \
            src/classifier.py \
            src/render.py \
            src/main.py \
            src/download_rap_profile.py \
            src/phase_profile.py \
            src/project_mrms_webmercator.py \
            src/build_phase_diagnostics.py \
            src/build_phase_radar_fusion.py \
            src/archive_mrms_history.py \
            src/build_history_precip_type.py

      - name: Run core MRMS processing
        working-directory: src
        env:
          MPLBACKEND: Agg
          OMP_NUM_THREADS: "1"
          OPENBLAS_NUM_THREADS: "1"
          MKL_NUM_THREADS: "1"
          NUMEXPR_NUM_THREADS: "1"
        run: |
          set -euo pipefail
          mkdir -p ../outputs
          python -u main.py 2>&1 | tee ../outputs/main.log

      - name: Verify live MRMS outputs immediately
        run: |
          set -euo pipefail
          echo "=============================================="
          echo "LIVE MRMS OUTPUT CHECK"
          echo "=============================================="
          bash ./src/verify_core_outputs.sh

      - name: Build phase probability and QC diagnostics
        env:
          OMP_NUM_THREADS: "1"
          OPENBLAS_NUM_THREADS: "1"
          MKL_NUM_THREADS: "1"
          NUMEXPR_NUM_THREADS: "1"
        run: |
          # This is a reporting/QC product, not part of the critical radar path.
          # Never allow a diagnostic failure to prevent Web Mercator, history, or Pages.
          set +e
          python -u src/build_phase_diagnostics.py
          rc=$?
          if [ "$rc" -ne 0 ]; then
            echo "WARNING: phase diagnostics failed with exit code $rc; continuing with core radar products."
          else
            echo "Phase diagnostics completed successfully."
          fi
          exit 0

      - name: Project browser MRMS rasters to Web Mercator
        run: |
          set -euo pipefail
          python -u src/project_mrms_webmercator.py

      # Archive history after the live Web Mercator products are complete.
      # History is deliberately non-critical so it can never take the live
      # radar/Pages product offline. The collector discovers any timestamped
      # MRMS frames missed while this workflow was queued or running.
      - name: Archive 8-hour full-CONUS MRMS history
        continue-on-error: true
        working-directory: src
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          OMP_NUM_THREADS: "1"
          OPENBLAS_NUM_THREADS: "1"
          MKL_NUM_THREADS: "1"
          NUMEXPR_NUM_THREADS: "1"
        run: |
          set -euo pipefail
          python -u archive_mrms_history.py

      # Diagnostics are deliberately OUTSIDE the critical live-radar path.
      # They can fail without taking the current MRMS radar offline.
      - name: Download optional diagnostic 2-D fields
        continue-on-error: true
        working-directory: src
        env:
          OMP_NUM_THREADS: "1"
          OPENBLAS_NUM_THREADS: "1"
          MKL_NUM_THREADS: "1"
          NUMEXPR_NUM_THREADS: "1"
        run: python -u download_mrms.py --diagnostics

      - name: Build MRMS diagnostics
        continue-on-error: true
        working-directory: src
        env:
          MPLBACKEND: Agg
          OMP_NUM_THREADS: "1"
          OPENBLAS_NUM_THREADS: "1"
          MKL_NUM_THREADS: "1"
          NUMEXPR_NUM_THREADS: "1"
        run: python -u build_mrms_diagnostics.py

      - name: Download vertical dual-pol data
        continue-on-error: true
        working-directory: src
        env:
          OMP_NUM_THREADS: "1"
          OPENBLAS_NUM_THREADS: "1"
          MKL_NUM_THREADS: "1"
          NUMEXPR_NUM_THREADS: "1"
        run: |
          if [ -f download_vertical_dualpol.py ]; then
            python -u download_vertical_dualpol.py
          else
            echo "Vertical dual-pol downloader is not present; skipping."
          fi

      - name: Build vertical dual-pol diagnostic
        continue-on-error: true
        working-directory: src
        env:
          MPLBACKEND: Agg
          OMP_NUM_THREADS: "1"
          OPENBLAS_NUM_THREADS: "1"
          MKL_NUM_THREADS: "1"
          NUMEXPR_NUM_THREADS: "1"
        run: |
          if [ -f build_vertical_dualpol_diagnostic.py ]; then
            python -u build_vertical_dualpol_diagnostic.py
          else
            echo "Vertical dual-pol diagnostic is not present; skipping."
          fi

      - name: Normalize vertical diagnostic filename
        continue-on-error: true
        run: |
          if [ -s outputs/vertical_dualpol_diagnostic.png ]; then
            cp outputs/vertical_dualpol_diagnostic.png outputs/mrms_vertical_dualpol.png
          fi

      - name: Build radar phase evidence fusion
        continue-on-error: true
        working-directory: src
        env:
          MPLBACKEND: Agg
          OMP_NUM_THREADS: "1"
          OPENBLAS_NUM_THREADS: "1"
          MKL_NUM_THREADS: "1"
          NUMEXPR_NUM_THREADS: "1"
        run: |
          if [ -f build_phase_radar_fusion.py ]; then
            python -u build_phase_radar_fusion.py
          else
            echo "Radar phase evidence fusion is not present; skipping."
          fi

      - name: Build winter precipitation diagnostic
        continue-on-error: true
        working-directory: src
        env:
          MPLBACKEND: Agg
          OMP_NUM_THREADS: "1"
          OPENBLAS_NUM_THREADS: "1"
          MKL_NUM_THREADS: "1"
          NUMEXPR_NUM_THREADS: "1"
        run: |
          if [ -f build_winter_mask.py ]; then
            python -u build_winter_mask.py
          else
            echo "Winter mask diagnostic is not present; skipping."
          fi

      - name: Create diagnostic fallbacks if needed
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          from PIL import Image, ImageDraw
          import json

          out = Path("outputs")
          out.mkdir(exist_ok=True)

          def placeholder(name, label):
              path = out / name
              if path.exists() and path.stat().st_size > 0:
                  return
              img = Image.new("RGB", (1200, 675), (238, 240, 242))
              d = ImageDraw.Draw(img)
              d.text((60, 300), label, fill=(80, 85, 90))
              img.save(path, optimize=True)

          placeholder("mrms_diagnostics.png", "MRMS diagnostic temporarily unavailable")
          placeholder("mrms_vertical_dualpol.png", "MRMS vertical dual-pol diagnostic temporarily unavailable")
          placeholder("phase_radar_fusion.png", "Radar phase evidence fusion temporarily unavailable")
          placeholder("phase_radar_fusion_overlay.png", "Radar phase evidence overlay temporarily unavailable")
          placeholder("phase_radar_fusion_overlay_web.png", "Radar phase evidence Web Mercator overlay temporarily unavailable")
          placeholder("phase_agreement.png", "Phase agreement diagnostic temporarily unavailable")
          placeholder("phase_agreement_overlay.png", "Phase agreement overlay temporarily unavailable")
          placeholder("phase_agreement_overlay_web.png", "Phase agreement Web Mercator overlay temporarily unavailable")
          placeholder("winter_mask_diagnostics.png", "Winter precipitation diagnostic temporarily unavailable")
          placeholder("winter_precip_type.png", "Precipitation-type composite temporarily unavailable")
          placeholder("phase_probability.png", "Phase probability layer temporarily unavailable")
          placeholder("phase_diagnostics.png", "Phase probability diagnostic temporarily unavailable")

          for name in ("mrms_diagnostics.json", "winter_mask_diagnostics.json", "phase_qc.json", "phase_radar_fusion.json", "phase_agreement.json"):
              path = out / name
              if not path.exists() or path.stat().st_size == 0:
                  path.write_text(
                      json.dumps({"status": "temporarily_unavailable"}, indent=2),
                      encoding="utf-8",
                  )
          PY

      # GitHub Release assets are intentionally delivered as downloads with
      # application/octet-stream/attachment semantics. They are excellent
      # persistent storage for Actions, but not reliable <img> sources in the
      # browser. Stage the archived WebP frames into the Pages deployment so
      # the history viewer can load them same-origin with image/webp.
      - name: Stage archived MRMS history for Pages
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          rm -rf site_history_tmp
          mkdir -p site_history_tmp

          python - <<'PY'
          import concurrent.futures
          import json
          import os
          from pathlib import Path
          from urllib.parse import quote

          import requests

          manifest_path = Path("outputs/mrms_history.json")
          history_dir = Path("site_history_tmp")
          history_dir.mkdir(parents=True, exist_ok=True)

          if not manifest_path.exists() or manifest_path.stat().st_size == 0:
              print("No MRMS history manifest found; skipping history staging.")
              raise SystemExit(0)

          manifest = json.loads(manifest_path.read_text(encoding="utf-8"))
          frames = manifest.get("frames", [])

          assets = {}
          for frame in frames:
              radar_name = frame.get("radar_asset")
              radar_api = frame.get("radar_api_url")
              if radar_name and radar_api:
                  assets[radar_name] = radar_api

              phase_name = frame.get("phase_asset")
              phase_api = frame.get("phase_api_url")
              if phase_name and phase_api:
                  assets[phase_name] = phase_api

              precip_type_name = frame.get("precip_type_asset")
              precip_type_api = frame.get("precip_type_api_url")
              if precip_type_name and precip_type_api:
                  assets[precip_type_name] = precip_type_api

          print(f"History frames in manifest: {len(frames)}")
          print(f"Unique history assets to stage: {len(assets)}")
          if not assets:
              print("No stageable history assets are present yet.")
              raise SystemExit(0)

          token = os.environ.get("GITHUB_TOKEN", "")
          session = requests.Session()
          session.headers.update({
              "Accept": "application/octet-stream",
              "Authorization": f"Bearer {token}",
              "X-GitHub-Api-Version": "2026-03-10",
              "User-Agent": "WinterRadar/1.1 (Pages history staging)",
          })

          def download(item):
              name, api_url = item
              target = history_dir / name
              if target.exists() and target.stat().st_size > 0:
                  return name, True, "cached"

              last_error = None
              for attempt in range(1, 4):
                  try:
                      response = session.get(api_url, timeout=(20, 120), allow_redirects=True)
                      response.raise_for_status()
                      data = response.content
                      if len(data) < 64 or not data[:4] == b"RIFF" or data[8:12] != b"WEBP":
                          raise RuntimeError(f"unexpected payload ({len(data):,} bytes; not WebP)")
                      target.write_bytes(data)
                      return name, True, f"{len(data):,} bytes"
                  except Exception as exc:
                      last_error = exc
              return name, False, str(last_error)

          failures = []
          completed = 0
          items = sorted(assets.items())

          with concurrent.futures.ThreadPoolExecutor(max_workers=24) as pool:
              futures = [pool.submit(download, item) for item in items]
              for future in concurrent.futures.as_completed(futures):
                  name, ok, info = future.result()
                  completed += 1
                  if not ok:
                      failures.append((name, info))
                  if completed % 50 == 0 or completed == len(items):
                      print(f"  Staged {completed}/{len(items)} history assets")

          if failures:
              print(f"History staging failures: {len(failures)}")
              for name, error in failures[:10]:
                  print(f"  FAILED {name}: {error}")
              if len(failures) > 10:
                  print(f"  ... plus {len(failures) - 10} more")
              raise SystemExit(1)

          print("MRMS history staging complete.")
          PY

      - name: Assemble Pages site
        run: |
          set -euo pipefail
          rm -rf site
          mkdir -p site/outputs site/history

          if [ -d site_history_tmp ]; then
            cp -a site_history_tmp/. site/history/
          fi

          cp index.html site/index.html
          cp outputs/mrms_current.png site/outputs/mrms_current.png
          cp outputs/mrms_current_web.png site/outputs/mrms_current_web.png
          if [ -s outputs/mrms_current_regional_web.png ]; then
            cp outputs/mrms_current_regional_web.png site/outputs/mrms_current_regional_web.png
          else
            echo "Regional sharp MRMS raster is unavailable; full-CONUS raster remains available."
          fi
          cp outputs/mrms_current.json site/outputs/mrms_current.json
          cp outputs/mrms_web.json site/outputs/mrms_web.json
          cp outputs/winter_phase_mask.png site/outputs/winter_phase_mask.png
          cp outputs/winter_phase_mask_web.png site/outputs/winter_phase_mask_web.png
          if [ -s outputs/winter_phase_mask_regional_web.png ]; then
            cp outputs/winter_phase_mask_regional_web.png site/outputs/winter_phase_mask_regional_web.png
          else
            echo "Regional sharp winter mask is unavailable; full-CONUS mask remains available."
          fi
          cp outputs/winter_precip_type.png site/outputs/winter_precip_type.png
          cp outputs/winter_precip_type_web.png site/outputs/winter_precip_type_web.png
          if [ -s outputs/winter_precip_type_regional_web.png ]; then
            cp outputs/winter_precip_type_regional_web.png site/outputs/winter_precip_type_regional_web.png
          else
            echo "Regional sharp precipitation-type composite is unavailable; full-CONUS composite remains available."
          fi
          cp outputs/mrms_diagnostics.png site/outputs/mrms_diagnostics.png
          cp outputs/mrms_vertical_dualpol.png site/outputs/mrms_vertical_dualpol.png
          cp outputs/phase_radar_fusion.png site/outputs/phase_radar_fusion.png
          cp outputs/phase_radar_fusion_overlay.png site/outputs/phase_radar_fusion_overlay.png
          cp outputs/phase_radar_fusion_overlay_web.png site/outputs/phase_radar_fusion_overlay_web.png
          cp outputs/phase_radar_fusion.json site/outputs/phase_radar_fusion.json
          cp outputs/phase_agreement.png site/outputs/phase_agreement.png
          cp outputs/phase_agreement_overlay.png site/outputs/phase_agreement_overlay.png
          cp outputs/phase_agreement_overlay_web.png site/outputs/phase_agreement_overlay_web.png
          cp outputs/phase_agreement.json site/outputs/phase_agreement.json
          cp outputs/winter_mask_diagnostics.png site/outputs/winter_mask_diagnostics.png
          cp outputs/phase_probability.png site/outputs/phase_probability.png
          cp outputs/phase_diagnostics.png site/outputs/phase_diagnostics.png
          cp outputs/phase_qc.json site/outputs/phase_qc.json
          cp outputs/mrms_diagnostics.json site/outputs/mrms_diagnostics.json
          cp outputs/winter_mask_diagnostics.json site/outputs/winter_mask_diagnostics.json
          cp outputs/main.log site/outputs/main.log

          if [ -s outputs/mrms_history.json ]; then
            cp outputs/mrms_history.json site/outputs/mrms_history.json
          else
            printf '%s\n' '{"version":"1.0-history","frame_count":0,"phase_snapshot_count":0,"frames":[]}' > site/outputs/mrms_history.json
          fi

          test -s site/outputs/winter_precip_type.png
          test -s site/outputs/winter_precip_type_web.png
          bash ./src/verify_core_outputs.sh site/outputs

          echo "=============================================="
          echo "PAGES CONTENT"
          echo "=============================================="
          find site -maxdepth 2 -type f -printf "%p (%s bytes)\n" | sort
          echo "History assets staged: $(find site/history -type f 2>/dev/null | wc -l)"

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
