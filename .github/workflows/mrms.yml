name: MRMS Winter Radar

on:
  workflow_dispatch:

  schedule:
    - cron: '2,7,12,17,22,27,32,37,42,47,52,57 * * * *'


permissions:
  contents: read
  pages: write
  id-token: write


concurrency:
  group: mrms-radar
  cancel-in-progress: true


jobs:

  # ========================================================
  # BUILD
  # ========================================================

  build:

    runs-on: ubuntu-latest

    steps:

      # ------------------------------------------------------
      # Checkout
      # ------------------------------------------------------

      - name: Checkout
        uses: actions/checkout@v6


      # ------------------------------------------------------
      # GitHub Pages
      # ------------------------------------------------------

      - name: Setup Pages
        uses: actions/configure-pages@v5


      # ------------------------------------------------------
      # System dependencies
      # ------------------------------------------------------

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libeccodes-dev \
            libeccodes-tools


      # ------------------------------------------------------
      # Python
      # ------------------------------------------------------

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'


      # ------------------------------------------------------
      # Python packages
      # ------------------------------------------------------

      - name: Install Python packages
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt


      # ======================================================
      # STANDARD MRMS PROCESSING
      # ======================================================

      - name: Process latest MRMS data
        working-directory: src
        run: |
          mkdir -p ../outputs
          python -u main.py 2>&1 | tee ../outputs/main.log


      - name: Show main log
        if: always()
        run: |
          echo "===== MAIN.PY LOG ====="
          cat outputs/main.log || true


      # ======================================================
      # VERTICAL DUAL-POL
      # ======================================================

      - name: Download vertical dual-pol MRMS
        working-directory: src
        run: |
          python download_vertical_dualpol.py


      - name: Build vertical dual-pol diagnostic
        working-directory: src
        run: |
          python build_vertical_dualpol_diagnostic.py


      # ------------------------------------------------------
      # Normalize vertical dual-pol filename
      # ------------------------------------------------------

      - name: Prepare vertical dual-pol output
        run: |
          echo "===== OUTPUTS BEFORE VERTICAL NORMALIZATION ====="
          ls -lah outputs

          if [ -f outputs/vertical_dualpol_diagnostic.png ]; then

            cp outputs/vertical_dualpol_diagnostic.png \
               outputs/mrms_vertical_dualpol.png

            echo "Vertical dual-pol image prepared successfully."

          elif [ -f outputs/mrms_vertical_dualpol.png ]; then

            echo "Vertical dual-pol image already has normalized name."

          else

            echo "ERROR: Vertical dual-pol diagnostic image was not created."
            echo "Contents of outputs:"
            ls -lah outputs
            exit 1

          fi


      # ======================================================
      # MRMS FIELD INSPECTION
      # ======================================================

      - name: Inspect MRMS fields
        working-directory: src
        run: |
          python inspect_mrms.py


      # ======================================================
      # WINTER PRECIPITATION INPUT DIAGNOSTIC
      # ======================================================

      - name: Inspect winter precipitation inputs
        working-directory: src
        run: |
          python build_winter_mask.py


      # ------------------------------------------------------
      # Verify winter diagnostic outputs
      # ------------------------------------------------------

      - name: Verify winter diagnostic outputs
        run: |

          echo "===== WINTER DIAGNOSTIC OUTPUTS ====="

          if [ ! -f outputs/winter_mask_diagnostics.png ]; then
            echo "ERROR: winter_mask_diagnostics.png was not created."
            exit 1
          fi

          if [ ! -f outputs/winter_mask_diagnostics.json ]; then
            echo "ERROR: winter_mask_diagnostics.json was not created."
            exit 1
          fi

          ls -lh \
            outputs/winter_mask_diagnostics.png \
            outputs/winter_mask_diagnostics.json


      # ======================================================
      # MRMS DIAGNOSTIC IMAGE
      # ======================================================

      - name: Build MRMS diagnostic image
        working-directory: src
        run: |
          python build_mrms_diagnostics.py


      # ======================================================
      # VERIFY REQUIRED OUTPUTS
      # ======================================================

      - name: Verify required outputs
        run: |

          echo "=========================================="
          echo "FINAL OUTPUT CHECK"
          echo "=========================================="

          required_files=(
            "outputs/mrms_current.png"
            "outputs/mrms_current.json"
            "outputs/mrms_diagnostics.png"
            "outputs/mrms_diagnostics.json"
            "outputs/mrms_vertical_dualpol.png"
            "outputs/winter_mask_diagnostics.png"
            "outputs/winter_mask_diagnostics.json"
          )

          for file in "${required_files[@]}"; do

            if [ ! -f "$file" ]; then
              echo "MISSING: $file"
              exit 1
            fi

            echo "OK: $file"

          done

          echo ""
          echo "All required outputs exist."


      # ======================================================
      # BUILD GITHUB PAGES SITE
      # ======================================================

      - name: Assemble Pages site
        run: |

          echo "=========================================="
          echo "BUILDING GITHUB PAGES SITE"
          echo "=========================================="

          # Start completely fresh.
          rm -rf site

          mkdir -p site/outputs

          # --------------------------------------------------
          # Main HTML
          # --------------------------------------------------

          echo "Copying index.html..."

          cp index.html site/index.html


          # --------------------------------------------------
          # Images
          # --------------------------------------------------

          echo "Copying images..."

          cp outputs/mrms_current.png \
             site/outputs/mrms_current.png

          cp outputs/mrms_diagnostics.png \
             site/outputs/mrms_diagnostics.png

          cp outputs/mrms_vertical_dualpol.png \
             site/outputs/mrms_vertical_dualpol.png

          cp outputs/winter_mask_diagnostics.png \
             site/outputs/winter_mask_diagnostics.png


          # --------------------------------------------------
          # JSON
          # --------------------------------------------------

          echo "Copying JSON..."

          cp outputs/mrms_current.json \
             site/outputs/mrms_current.json

          cp outputs/mrms_diagnostics.json \
             site/outputs/mrms_diagnostics.json

          cp outputs/winter_mask_diagnostics.json \
             site/outputs/winter_mask_diagnostics.json


          # ==================================================
          # VERIFY ACTUAL PAGES DIRECTORY
          # ==================================================

          echo ""
          echo "=========================================="
          echo "FINAL PAGES DIRECTORY"
          echo "=========================================="

          find site -type f -printf '%p (%s bytes)\n' | sort


          echo ""
          echo "=========================================="
          echo "VERIFYING PAGES IMAGES"
          echo "=========================================="

          pages_files=(
            "site/index.html"
            "site/outputs/mrms_current.png"
            "site/outputs/mrms_diagnostics.png"
            "site/outputs/mrms_vertical_dualpol.png"
            "site/outputs/winter_mask_diagnostics.png"
            "site/outputs/mrms_current.json"
            "site/outputs/mrms_diagnostics.json"
            "site/outputs/winter_mask_diagnostics.json"
          )

          for file in "${pages_files[@]}"; do

            if [ ! -f "$file" ]; then
              echo "ERROR: Pages artifact is missing:"
              echo "       $file"
              exit 1
            fi

            echo "OK: $file"

          done


          echo ""
          echo "=========================================="
          echo "PAGES SITE READY"
          echo "=========================================="


      # ======================================================
      # UPLOAD GITHUB PAGES ARTIFACT
      # ======================================================

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: 'site'


  # ========================================================
  # DEPLOY
  # ========================================================

  deploy:

    needs: build

    runs-on: ubuntu-latest

    environment:

      name: github-pages

      url: ${{ steps.deployment.outputs.page_url }}

    steps:

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
