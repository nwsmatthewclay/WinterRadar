name: MRMS Winter Radar

on:
  workflow_dispatch:
  schedule:
    - cron: "2,7,12,17,22,27,32,37,42,47,52,57 * * * *"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: mrms-radar
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libeccodes-dev \
            libeccodes-tools \
            libgeos-dev \
            libproj-dev \
            proj-data \
            proj-bin

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install \
            numpy \
            requests \
            Pillow \
            xarray \
            cfgrib \
            matplotlib \
            gspread \
            google-auth \
            google-api-python-client \
            pygrib \
            cartopy \
            metpy

      # ==========================================================
      # LIVE MRMS MAP — this is the known-good path
      # ==========================================================
      - name: Run main MRMS processing
        working-directory: src
        env:
          MPLBACKEND: Agg
          OMP_NUM_THREADS: "1"
          OPENBLAS_NUM_THREADS: "1"
          MKL_NUM_THREADS: "1"
          NUMEXPR_NUM_THREADS: "1"
        run: |
          set -e
          mkdir -p ../outputs
          python -u main.py 2>&1 | tee ../outputs/main.log

      - name: Verify live MRMS outputs immediately
        run: |
          set -e
          echo "=============================================="
          echo "LIVE MRMS OUTPUT CHECK"
          echo "=============================================="
          test -s outputs/mrms_current.png
          test -s outputs/mrms_current.json
          test -s outputs/winter_phase_mask.png
          ls -lh \
            outputs/mrms_current.png \
            outputs/mrms_current.json \
            outputs/winter_phase_mask.png
          echo "LIVE MRMS OUTPUTS READY"

      # ==========================================================
      # DIAGNOSTICS — retained so the existing site does not lose
      # any of its diagnostic assets.
      # ==========================================================
      - name: Build MRMS diagnostics
        working-directory: src
        continue-on-error: true
        env:
          MPLBACKEND: Agg
          OMP_NUM_THREADS: "1"
          OPENBLAS_NUM_THREADS: "1"
          MKL_NUM_THREADS: "1"
          NUMEXPR_NUM_THREADS: "1"
        run: python -u build_mrms_diagnostics.py

      - name: Download vertical dual-pol data
        working-directory: src
        continue-on-error: true
        env:
          OMP_NUM_THREADS: "1"
          OPENBLAS_NUM_THREADS: "1"
          MKL_NUM_THREADS: "1"
          NUMEXPR_NUM_THREADS: "1"
        run: python -u download_vertical_dualpol.py

      - name: Build vertical dual-pol diagnostic
        working-directory: src
        continue-on-error: true
        env:
          MPLBACKEND: Agg
          OMP_NUM_THREADS: "1"
          OPENBLAS_NUM_THREADS: "1"
          MKL_NUM_THREADS: "1"
          NUMEXPR_NUM_THREADS: "1"
        run: python -u build_vertical_dualpol_diagnostic.py

      - name: Normalize vertical diagnostic filename
        continue-on-error: true
        run: |
          if [ -s outputs/vertical_dualpol_diagnostic.png ]; then
            cp outputs/vertical_dualpol_diagnostic.png outputs/mrms_vertical_dualpol.png
          fi

      - name: Build winter precipitation diagnostic
        working-directory: src
        continue-on-error: true
        env:
          MPLBACKEND: Agg
          OMP_NUM_THREADS: "1"
          OPENBLAS_NUM_THREADS: "1"
          MKL_NUM_THREADS: "1"
          NUMEXPR_NUM_THREADS: "1"
        run: python -u build_winter_mask.py

      # ==========================================================
      # Create harmless fallback assets when a diagnostic fails.
      # This prevents the existing dashboard from throwing 404s.
      # ==========================================================
      - name: Create diagnostic fallbacks if needed
        run: |
          set -e
          python - <<'PY'
          from pathlib import Path
          from PIL import Image, ImageDraw
          import json

          out = Path("outputs")
          out.mkdir(exist_ok=True)

          def placeholder(name, label):
              path = out / name
              if path.exists() and path.stat().st_size > 0:
                  return
              img = Image.new("RGB", (1200, 675), (238, 240, 242))
              d = ImageDraw.Draw(img)
              d.text((60, 300), label, fill=(80, 85, 90))
              img.save(path, optimize=True)

          placeholder("mrms_diagnostics.png", "MRMS diagnostic temporarily unavailable")
          placeholder("mrms_vertical_dualpol.png", "MRMS vertical dual-pol diagnostic temporarily unavailable")
          placeholder("winter_mask_diagnostics.png", "Winter mask diagnostic temporarily unavailable")

          for name in ("mrms_diagnostics.json", "winter_mask_diagnostics.json"):
              path = out / name
              if not path.exists() or path.stat().st_size == 0:
                  path.write_text(json.dumps({"status": "temporarily_unavailable"}, indent=2))
          PY

      # ==========================================================
      # Pages artifact — always contains every file the current
      # dashboard expects.
      # ==========================================================
      - name: Assemble Pages site
        run: |
          set -e
          rm -rf site
          mkdir -p site/outputs

          cp index.html site/index.html
          cp outputs/mrms_current.png site/outputs/mrms_current.png
          cp outputs/mrms_current.json site/outputs/mrms_current.json
          cp outputs/winter_phase_mask.png site/outputs/winter_phase_mask.png
          cp outputs/mrms_diagnostics.png site/outputs/mrms_diagnostics.png
          cp outputs/mrms_diagnostics.json site/outputs/mrms_diagnostics.json
          cp outputs/mrms_vertical_dualpol.png site/outputs/mrms_vertical_dualpol.png
          cp outputs/winter_mask_diagnostics.png site/outputs/winter_mask_diagnostics.png
          cp outputs/winter_mask_diagnostics.json site/outputs/winter_mask_diagnostics.json

          echo "=============================================="
          echo "PAGES CONTENT"
          echo "=============================================="
          find site -maxdepth 2 -type f -printf "%p (%s bytes)\n" | sort

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
