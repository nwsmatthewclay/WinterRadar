name: MRMS Winter Radar — Archive

on:
  workflow_dispatch:
  schedule:
    # Archive runs every 10 minutes.
    - cron: "2,12,22,32,42,52 * * * *"

permissions:
  contents: write

# Never cancel an archive run that is already processing.
# A new scheduled run will wait rather than interrupting the current backfill.
concurrency:
  group: mrms-history
  cancel-in-progress: false

jobs:
  archive:
    runs-on: ubuntu-latest

    # The archive can process up to 24 scans per run; 6 stay reserved for the newest edge while the remaining capacity heals composite/radar gaps.
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libeccodes-dev \
            libeccodes-tools

      - name: Restore RAP profile cache
        uses: actions/cache@v4
        with:
          path: data/rap_profile_cache
          key: winterradar-rap-profile-${{ github.run_id }}
          restore-keys: |
            winterradar-rap-profile-

      - name: Install Python dependencies
        env:
          PIP_DEFAULT_TIMEOUT: "60"
          PIP_RETRIES: "10"
        run: |
          set -euo pipefail

          # GitHub-hosted runners can occasionally time out while pip is resolving
          # cfgrib's transitive click dependency. Install it explicitly first so
          # the resolver does not repeatedly rediscover it during backtracking.
          python -m pip install --disable-pip-version-check \
            --retries 10 \
            --timeout 60 \
            --prefer-binary \
            "click>=8.1"

          python -m pip install --disable-pip-version-check \
            --retries 10 \
            --timeout 60 \
            --prefer-binary \
            -r requirements.txt

          python -m pip install --disable-pip-version-check \
            --retries 10 \
            --timeout 60 \
            --prefer-binary \
            scipy

      - name: Archive syntax QC
        run: |
          python -m py_compile \
            src/config.py \
            src/render.py \
            src/archive_mrms_history.py \
            src/build_history_precip_type.py

      - name: Run 10-minute MRMS archive/backfill
        working-directory: src
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          MRMS_HISTORY_MAX_FRAMES_PER_RUN: "24"
          MRMS_HISTORY_MAX_EDGE_FRAMES_PER_RUN: "6"
          OMP_NUM_THREADS: "1"
          OPENBLAS_NUM_THREADS: "1"
          MKL_NUM_THREADS: "1"
          NUMEXPR_NUM_THREADS: "1"
        run: |
          set -euo pipefail
          mkdir -p ../outputs
          python -u archive_mrms_history.py 2>&1 | tee ../outputs/archive.log

      - name: Show archive status
        if: always()
        run: |
          echo "## MRMS 10-Minute Archive Run Status" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"

          if [ -s outputs/mrms_archive_status.json ]; then
            python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          from pathlib import Path

          p = Path("outputs/mrms_archive_status.json")
          d = json.loads(p.read_text())

          print("| Metric | Value |")
          print("|---|---|")

          for key, label in [
              ("generated_at_utc", "Archive run UTC"),
              ("history_hours", "Retention window"),
              ("live_watermark_utc", "Live watermark (informational)"),
              ("archive_upper_utc", "Archive ingest edge"),
              ("mrms_observations_in_window", "MRMS observations in retention window"),
              ("radar_assets_before", "Radar stored before"),
              ("radar_missing_before", "Radar missing before"),
              ("radar_uploaded_this_run", "Radar uploaded this run"),
              ("radar_remaining_missing", "Radar still missing"),
              ("max_frame_gap_seconds", "Largest timestamp gap (s)"),
              ("significant_frame_gaps_over_5min", "Gaps over 5 minutes"),
              ("phase_remaining_missing", "Phase still missing"),
              ("precip_type_remaining_missing", "Precip type still missing"),
              ("complete_composite_pairs", "Complete phase + precip pairs"),
              ("composite_pairs_remaining_missing", "Composite pairs still missing"),
              ("oldest_stored_utc", "Oldest stored"),
              ("newest_stored_utc", "Newest stored"),
              ("status", "Status"),
          ]:
              print(f"| {label} | {d.get(key, '—')} |")

          print()
          print("### Stored file timestamps")

          for item in d.get("recent_files", []):
              print(f"- {item}")
          PY
          else
            echo "Archive status JSON was not produced." >> "$GITHUB_STEP_SUMMARY"
          echo "Check the job log for composite-generation or RAP errors." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload archive debug artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mrms-archive-debug
          path: |
            outputs/archive.log
            outputs/mrms_archive_status.json
            outputs/mrms_history.json
          if-no-files-found: ignore
