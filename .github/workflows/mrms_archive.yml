name: MRMS Winter Radar — Archive

on:
  workflow_dispatch:
  schedule:
    - cron: "2,7,12,17,22,27,32,37,42,47,52,57 * * * *"

permissions:
  contents: write

# The archive is idempotent. If a run is still backfilling when the next
# scheduled run starts, the newest run is more useful because it rechecks the
# same rolling 3-hour retention window and continues from whatever assets already exist.
concurrency:
  group: mrms-history
  cancel-in-progress: true

jobs:
  archive:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libeccodes-dev \
            libeccodes-tools

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install scipy

      - name: Archive syntax QC
        run: |
          python -m py_compile \
            src/config.py \
            src/render.py \
            src/archive_mrms_history.py \
            src/build_history_precip_type.py

      - name: Run 30-minute MRMS archive/backfill
        working-directory: src
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          OMP_NUM_THREADS: "1"
          OPENBLAS_NUM_THREADS: "1"
          MKL_NUM_THREADS: "1"
          NUMEXPR_NUM_THREADS: "1"
        run: |
          set -euo pipefail
          mkdir -p ../outputs
          python -u archive_mrms_history.py 2>&1 | tee ../outputs/archive.log

      - name: Show archive status
        if: always()
        run: |
          echo "## MRMS 30-Minute Archive Run Status" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          if [ -s outputs/mrms_archive_status.json ]; then
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          from pathlib import Path
          p = Path("outputs/mrms_archive_status.json")
          d = json.loads(p.read_text())
          print("| Metric | Value |")
          print("|---|---|")
          for key, label in [
              ("generated_at_utc", "Archive run UTC"),
              ("history_hours", "Retention window"),
              ("live_watermark_utc", "Live watermark"),
              ("mrms_observations_in_window", "MRMS observations in retention window"),
              ("radar_assets_before", "Radar stored before"),
              ("radar_missing_before", "Radar missing before"),
              ("radar_uploaded_this_run", "Radar uploaded this run"),
              ("radar_remaining_missing", "Radar still missing"),
              ("phase_remaining_missing", "Phase still missing"),
              ("precip_type_remaining_missing", "Precip type still missing"),
              ("oldest_stored_utc", "Oldest stored"),
              ("newest_stored_utc", "Newest stored"),
              ("status", "Status"),
          ]:
              print(f"| {label} | {d.get(key, '—')} |")
          print()
          print("### Stored file timestamps")
          for item in d.get("recent_files", []):
              print(f"- `{item['asset_name']}` — {item['timestamp_utc']}")
          PY
          else
            echo "Archive status JSON was not produced." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload debug/status files
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mrms-archive-debug
          path: |
            outputs/mrms_archive_status.json
            outputs/mrms_history.json
            outputs/archive.log
          if-no-files-found: ignore
          retention-days: 3
